[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventor-mcp"
version = "0.1.0"
description = "MCP server that turns natural-language descriptions into parametric Autodesk Inventor models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "OnlyCat" }]
keywords = ["mcp", "autodesk", "inventor", "cad", "parametric", "text-to-cad"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "mcp>=1.2",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# The COM backend only works on Windows with Autodesk Inventor installed.
inventor = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8.0"]

[project.scripts]
inventor-mcp = "inventor_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["inventor_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
