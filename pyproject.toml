[build-system]
# PEP 639: `license` is an SPDX string and `license-files` names the file.
# The table form (`{ text = "MIT" }`) is rejected outright from 77 on, which
# is what every CI run failed on before anybody looked at the logs.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventor-mcp"
version = "0.1.0"
description = "MCP server that turns natural-language descriptions into parametric Autodesk Inventor models"
readme = "README.md"
# 3.11 because that is the oldest leg CI runs; a floor nothing tests is a
# claim rather than a fact, and tests/test_supported_pythons.py holds the
# two together. Raise the leg first if this needs to go lower.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OnlyCat" }]
keywords = ["mcp", "autodesk", "inventor", "cad", "parametric", "text-to-cad"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "mcp>=1.2",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# The COM backend only works on Windows with Autodesk Inventor installed.
inventor = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8.0"]

[project.scripts]
inventor-mcp = "inventor_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["inventor_mcp*"]

# The DFM bridge is JavaScript, and a wheel that leaves it out installs a
# manufacturability loop that cannot run at all -- with nothing to say about why,
# since every other part of it imports fine.
[tool.setuptools.package-data]
inventor_mcp = ["dfm/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
